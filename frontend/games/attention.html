<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroPlay - Attention Grid</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="top-nav">
      <div class="brand-block"><h1>NeuroPlay</h1></div>
      <nav class="nav-links">
        <a class="nav-btn" href="../index.html">Home</a>
        <a class="nav-btn" href="../games.html">Games</a>
        <a class="nav-btn" href="../patient-report.html">Patient Report</a>
      </nav>
      <div id="authArea" class="auth-actions"></div>
    </header>

    <header class="hero">
      <h1>Attention Grid</h1>
      <p>Built for patients with sustained-attention deficits after stroke or TBI.</p>
      <a href="../games.html" class="dashboard-link">Back to Games</a>
    </header>

    <section class="controls">
      <label for="attentionUserId">Patient ID</label>
      <input id="attentionUserId" type="text" placeholder="patient-001" />
      <button id="attentionStart">Start Attention Test</button>
    </section>

    <section class="status-panel">
      <div><span>Hits:</span> <strong id="hits">0</strong></div>
      <div><span>Misses:</span> <strong id="misses">0</strong></div>
      <div><span>Accuracy:</span> <strong id="attentionAccuracy">0%</strong></div>
    </section>

    <section class="attention-grid" id="attentionGrid"></section>
    <p id="attentionMessage" class="message">Start test to begin.</p>
    <p id="attentionClinical" class="clinical-box"></p>
  </main>

  <script type="module" src="attention.js"></script>
</body>
</html>
