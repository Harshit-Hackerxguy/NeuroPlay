<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroPlay - Reaction Sprint</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="top-nav">
      <div class="brand-block"><h1>NeuroPlay</h1></div>
      <nav class="nav-links">
        <a class="nav-btn" href="../index.html">Home</a>
        <a class="nav-btn" href="../games.html">Games</a>
        <a class="nav-btn" href="../patient-report.html">Patient Report</a>
      </nav>
      <div id="authArea" class="auth-actions"></div>
    </header>

    <header class="hero">
      <h1>Reaction Sprint</h1>
      <p>Built for patients with delayed motor initiation and response planning deficits.</p>
      <a href="../games.html" class="dashboard-link">Back to Games</a>
    </header>

    <section class="controls">
      <label for="reactionUserId">Patient ID</label>
      <input id="reactionUserId" type="text" placeholder="patient-001" />
      <button id="reactionStart">Start Reaction Test</button>
    </section>

    <section class="status-panel">
      <div><span>Attempts:</span> <strong id="attempts">0</strong></div>
      <div><span>Fastest:</span> <strong id="fastest">0 ms</strong></div>
      <div><span>Average:</span> <strong id="average">0 ms</strong></div>
    </section>

    <button id="reactionTarget" class="target-btn" disabled>Wait for green...</button>
    <p id="reactionMessage" class="message">Start test to begin.</p>
    <p id="reactionClinical" class="clinical-box"></p>
  </main>

  <script type="module" src="reaction.js"></script>
</body>
</html>
